# Tab'ai ir grupių tvarka — settings.yaml → layout.
# Metrikos — Prometheus `internal` tinkle (node-exporter, cAdvisor, Traefik, postgres-exporter).
# Būsenos taškai — Swarm servisai per core_socket-proxy (docker.yaml: `cetex`).
# Kiekvienas projektas = viena grupė = vienas tab'as; custom.js juos sudeda į meniu „Projektai ▾“
# (visi tab'ai, išskyrus Serveris / Įrankiai / Nuorodos). Naujas projektas: grupė čia + layout įrašas.

- Serveris:
    - cetex.dev:
        icon: mdi-server
        description: 176.223.132.42 · scraper'io išeinantys 212.24.104.223, 80.209.225.230
        widget:
          type: prometheusmetric
          url: http://monitoring_prometheus:9090
          refreshInterval: 15000
          metrics:
            - label: CPU
              query: '100 * (1 - avg(rate(node_cpu_seconds_total{mode="idle"}[5m])))'
              format:
                type: number
                options:
                  maximumFractionDigits: 0
                suffix: ' %'
            - label: RAM
              query: '100 * (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)'
              format:
                type: number
                options:
                  maximumFractionDigits: 0
                suffix: ' %'
            - label: Diskas
              query: '100 * (1 - node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"})'
              format:
                type: number
                options:
                  maximumFractionDigits: 0
                suffix: ' %'
            - label: Veikia
              query: 'time() - node_boot_time_seconds'
              format:
                type: duration

    - Apkrova:
        icon: mdi-chart-line
        description: Traefik srautas visiems projektams
        widget:
          type: prometheusmetric
          url: http://monitoring_prometheus:9090
          refreshInterval: 15000
          metrics:
            - label: Load 1 min
              query: 'node_load1'
              format:
                type: number
                options:
                  maximumFractionDigits: 2
            - label: Užklausos
              query: 'sum(rate(traefik_entrypoint_requests_total{entrypoint="websecure"}[5m]))'
              format:
                type: number
                options:
                  maximumFractionDigits: 2
                suffix: ' /s'
            - label: 5xx
              query: 'sum(rate(traefik_entrypoint_requests_total{entrypoint="websecure",code=~"5.."}[5m])) or vector(0)'
              format:
                type: number
                options:
                  maximumFractionDigits: 2
                suffix: ' /s'
            - label: Užklausų per 24 h
              query: 'sum(increase(traefik_entrypoint_requests_total{entrypoint="websecure"}[24h]))'
              format:
                type: number
                options:
                  maximumFractionDigits: 0

    - Docker Swarm:
        icon: mdi-docker
        description: Visi stack'ai
        widget:
          type: prometheusmetric
          url: http://monitoring_prometheus:9090
          refreshInterval: 30000
          metrics:
            - label: Konteineriai
              query: 'count(time() - container_last_seen{container_label_com_docker_swarm_service_name!=""} < 60)'
              format:
                type: number
                options:
                  maximumFractionDigits: 0
            - label: Servisai
              query: 'count(count by (container_label_com_docker_swarm_service_name) (time() - container_last_seen{container_label_com_docker_swarm_service_name!=""} < 60))'
              format:
                type: number
                options:
                  maximumFractionDigits: 0
            - label: RAM
              query: 'sum(container_memory_working_set_bytes{container_label_com_docker_swarm_service_name!=""})'
              format:
                type: bytes
            - label: Perkrauta per 24 h
              query: 'count(count by (name) (count_over_time(container_last_seen{container_label_com_docker_swarm_service_name!=""}[24h]))) - count(count by (container_label_com_docker_swarm_service_name) (time() - container_last_seen{container_label_com_docker_swarm_service_name!=""} < 60))'
              format:
                type: number
                options:
                  maximumFractionDigits: 0

- Būsena:
    - Įspėjimai ir stebėjimas:
        icon: mdi-bell-alert
        href: https://alerts.cetex.dev/
        description: Alertmanager → sarunas@pickzy.app
        server: cetex
        container: monitoring_alertmanager
        widget:
          type: prometheusmetric
          url: http://monitoring_prometheus:9090
          refreshInterval: 30000
          metrics:
            - label: Aktyvūs
              query: 'count(ALERTS{alertstate="firing"}) or vector(0)'
              format:
                type: number
                options:
                  maximumFractionDigits: 0
            - label: Laukia
              query: 'count(ALERTS{alertstate="pending"}) or vector(0)'
              format:
                type: number
                options:
                  maximumFractionDigits: 0
            - label: Taikiniai veikia
              query: 'sum(up)'
              format:
                type: number
                options:
                  maximumFractionDigits: 0
            - label: Neveikia
              query: 'count(up == 0) or vector(0)'
              format:
                type: number
                options:
                  maximumFractionDigits: 0

    - Sertifikatai:
        icon: mdi-certificate
        href: https://traefik.cetex.dev/
        description: Let's Encrypt per Traefik
        server: cetex
        container: core_traefik
        widget:
          type: prometheusmetric
          url: http://monitoring_prometheus:9090
          refreshInterval: 300000
          metrics:
            - label: Iš viso
              query: 'count(traefik_tls_certs_not_after)'
              format:
                type: number
                options:
                  maximumFractionDigits: 0
            - label: Artimiausias baigsis po
              query: 'min(traefik_tls_certs_not_after - time()) / 86400'
              format:
                type: number
                options:
                  maximumFractionDigits: 0
                suffix: ' d.'
            - label: Baigiasi < 30 d.
              query: 'count((traefik_tls_certs_not_after - time()) < 30 * 86400) or vector(0)'
              format:
                type: number
                options:
                  maximumFractionDigits: 0

    - PostgreSQL:
        icon: mdi-elephant
        href: https://adminer.cetex.dev/
        description: core_postgresql — visos DB
        server: cetex
        container: core_postgresql
        widget:
          type: prometheusmetric
          url: http://monitoring_prometheus:9090
          refreshInterval: 30000
          metrics:
            - label: Dydis
              query: 'sum(pg_database_size_bytes)'
              format:
                type: bytes
            - label: Jungtys
              query: 'sum(pg_stat_activity_count)'
              format:
                type: number
                options:
                  maximumFractionDigits: 0
            - label: Transakcijos
              query: 'sum(rate(pg_stat_database_xact_commit[5m]))'
              format:
                type: number
                options:
                  maximumFractionDigits: 0
                suffix: ' /s'
            - label: Cache hit
              query: '100 * sum(pg_stat_database_blks_hit) / (sum(pg_stat_database_blks_hit) + sum(pg_stat_database_blks_read))'
              format:
                type: number
                options:
                  maximumFractionDigits: 2
                suffix: ' %'

