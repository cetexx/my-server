        server: cetex
        container: lvl_lvl-web
        siteMonitor: https://lvl.mobi/

    - zombiufabrikas.lt:
        icon: mdi-web
        href: https://zombiufabrikas.lt/
        description: DNS rodo į 79.98.25.1, ne į šį serverį — sertifikatas neatsinaujina
        server: cetex
        container: zombiufabrikas_zombiufabrikas-web
        siteMonitor: https://zombiufabrikas.lt/
