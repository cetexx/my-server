- Pickzy:
    - API:
        icon: mdi-api
        href: https://api.pickzy.app/api/health
        description: api.pickzy.app — Laravel, Horizon eilės
        server: cetex
        container: pickzy_api
        siteMonitor: https://api.pickzy.app/api/health
        widget:
          type: customapi
          url: https://api.pickzy.app/api/health
          refreshInterval: 60000
          mappings:
            - field: version
              label: Versija
            - field: checks.db.status
              label: DB
            - field: checks.redis.status
              label: Redis
            - field: checks.horizon.status
              label: Eilės

    - Sinchronizacija:
        icon: mdi-sync
        description: Wolt ir Bolt meniu
        widget:
          type: customapi
          url: https://api.pickzy.app/api/health
          refreshInterval: 60000
          mappings:
            - field: checks.wolt_last_sync.age_seconds
              label: Wolt sync prieš
              format: duration
            - field: checks.bolt_last_sync.age_seconds
              label: Bolt sync prieš
              format: duration
            - field: checks.wolt_freshness.status
              label: Wolt meniu
            - field: checks.bolt_freshness.status
              label: Bolt meniu

    - Srautas:
        icon: mdi-chart-line
        description: Traefik — api, partneriai, landing
        widget:
          type: prometheusmetric
          url: http://monitoring_prometheus:9090
          refreshInterval: 30000
          metrics:
            - label: Užklausos
              query: 'sum(rate(traefik_service_requests_total{service=~"pickzy-.*"}[5m]))'
              format:
                type: number
                options:
                  maximumFractionDigits: 2
                suffix: ' /s'
            - label: API atsakas
              query: '1000 * sum(rate(traefik_service_request_duration_seconds_sum{service="pickzy-api@swarm"}[5m])) / sum(rate(traefik_service_request_duration_seconds_count{service="pickzy-api@swarm"}[5m]))'
              format:
                type: number
                options:
                  maximumFractionDigits: 0
                suffix: ' ms'
            - label: Užklausų per 24 h
              query: 'sum(increase(traefik_service_requests_total{service=~"pickzy-.*"}[24h]))'
              format:
                type: number
                options:
                  maximumFractionDigits: 0
            - label: 5xx per 24 h
              query: 'sum(increase(traefik_service_requests_total{service=~"pickzy-.*",code=~"5.."}[24h])) or vector(0)'
              format:
                type: number
                options:
                  maximumFractionDigits: 0

    - Konteineriai:
        icon: mdi-docker
        description: api, landing, partners, redis, egress — „Veikia“ = API
        widget:
          type: prometheusmetric
          url: http://monitoring_prometheus:9090
          refreshInterval: 30000
          metrics:
            - label: CPU (serverio)
              query: '100 * sum(rate(container_cpu_usage_seconds_total{container_label_com_docker_swarm_service_name=~"pickzy_.*"}[5m])) / count(node_cpu_seconds_total{mode="idle"})'
              format:
                type: number
                options:
                  maximumFractionDigits: 1
                suffix: ' %'
            - label: RAM
              query: 'sum(container_memory_working_set_bytes{container_label_com_docker_swarm_service_name=~"pickzy_.*"})'
              format:
                type: bytes
            - label: Veikia
              query: 'time() - max(container_start_time_seconds{container_label_com_docker_swarm_service_name="pickzy_api"})'
              format:
                type: duration
            - label: Perkrauta per 24 h
              query: 'count(count by (name) (count_over_time(container_last_seen{container_label_com_docker_swarm_service_name=~"pickzy_.*"}[24h]))) - count(count by (container_label_com_docker_swarm_service_name) (container_last_seen{container_label_com_docker_swarm_service_name=~"pickzy_.*"}))'
              format:
                type: number
                options:
                  maximumFractionDigits: 0

    - Duomenys:
        icon: mdi-database
        description: PostgreSQL ir eilių Redis
        widget:
          type: prometheusmetric
          url: http://monitoring_prometheus:9090
          refreshInterval: 60000
          metrics:
            - label: DB pickzy
              query: 'pg_database_size_bytes{datname="pickzy"}'
              format:
                type: bytes
            - label: DB jungtys
              query: 'sum(pg_stat_activity_count{datname="pickzy"}) or vector(0)'
              format:
                type: number
                options:
                  maximumFractionDigits: 0
            - label: Admin DB
              query: 'pg_database_size_bytes{datname="pickzy_admin"}'
              format:
                type: bytes
            - label: Eilių Redis
              query: 'sum(container_memory_working_set_bytes{container_label_com_docker_swarm_service_name="pickzy_redis"})'
              format:
                type: bytes

    - pickzy.app:
        icon: mdi-web
        href: https://pickzy.app/
        description: landing
        server: cetex
        container: pickzy_landing
        siteMonitor: https://pickzy.app/

    - partners.pickzy.app:
        icon: mdi-store
        href: https://partners.pickzy.app/
        description: savininkų panelė
        server: cetex
        container: pickzy_partners
        siteMonitor: https://partners.pickzy.app/

