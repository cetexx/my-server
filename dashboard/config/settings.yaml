title: cetex.dev
description: Serverio būsena, įrankiai ir projektai
theme: dark
color: slate
headerStyle: boxedWidgets
cardStyle: hairline
blockStyle: refined
cardBlur: sm
iconStyle: theme
useEqualHeights: true
statusStyle: dot
hideVersion: true
disableIndexing: true

# Pradėk rašyti bet kur puslapyje — atsidaro paieška per įrankius, projektus ir nuorodas.
quicklaunch:
  searchDescriptions: true
  hideInternetSearch: true
  hideVisitURL: true
  showSearchSuggestions: false

# Tab'ai = puslapiai; eilės tvarka čia = tab'ų tvarka. Tiesioginė nuoroda: home.cetex.dev/#pickzy.
# Serveris / Įrankiai / Nuorodos — pagrindiniai tab'ai. VISI kiti tab'ai yra projektai: custom.js
# juos paslepia iš juostos ir sudeda į meniu „Projektai ▾“ (custom.js → MAIN_TABS).
