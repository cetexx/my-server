version: "3.8"

services:
  prometheus:
    image: prom/prometheus:v3.13.5  # 3.13 = LTS (to 2027-07-31). TSDB readable by 2.55+ (rollback = image)
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.enable-lifecycle
    volumes:
      - /opt/my-server/prometheus/data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
    configs:
      - source: prometheus-config
        target: /etc/prometheus/prometheus.yml
      - source: alert-rules
        target: /etc/prometheus/alert-rules.yml
    networks:
      - internal
      - traefik-public
    deploy:
      mode: replicated
      replicas: 1
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M
      labels:
        - traefik.enable=true
        - traefik.http.routers.prometheus.rule=Host(`prometheus.${DOMAIN}`)
        - traefik.http.routers.prometheus.entrypoints=websecure
        - traefik.http.routers.prometheus.tls.certresolver=letsencrypt
        - traefik.http.routers.prometheus.middlewares=admin-whitelist
        - traefik.http.services.prometheus.loadbalancer.server.port=9090

  grafana:
    # Bumped to 13.x: per upstream 12.x→13.x migration guide, the
    # schema auto-upgrades cleanly on PostgreSQL. Main consumer-side
    # change is React 19, which only affects custom plugins (none here).
    image: grafana/grafana:13.3.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
      GF_DATABASE_TYPE: postgres
      GF_DATABASE_HOST: core_postgresql:5432
      GF_DATABASE_NAME: grafana
      GF_DATABASE_USER: grafana
      GF_DATABASE_PASSWORD: ${GRAFANA_DB_PASSWORD}
      GF_DATABASE_SSL_MODE: disable
    volumes:
      - /opt/my-server/grafana/data:/var/lib/grafana
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    configs:
      - source: grafana-datasource
        target: /etc/grafana/provisioning/datasources/datasource.yml
      - source: grafana-dashboard-provider
        target: /etc/grafana/provisioning/dashboards/dashboards.yml
      - source: dashboard-node
        target: /var/lib/grafana/dashboards/node-exporter.json
      - source: dashboard-docker
        target: /var/lib/grafana/dashboards/docker.json
      - source: dashboard-postgresql
        target: /var/lib/grafana/dashboards/postgresql.json
      - source: dashboard-traefik
        target: /var/lib/grafana/dashboards/traefik.json
    networks:
      - internal
      - traefik-public
    deploy:
      mode: replicated
      replicas: 1
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
      labels:
        - traefik.enable=true
        - traefik.http.routers.grafana.rule=Host(`grafana.${DOMAIN}`)
        - traefik.http.routers.grafana.entrypoints=websecure
        - traefik.http.routers.grafana.tls.certresolver=letsencrypt
        - traefik.http.routers.grafana.middlewares=admin-whitelist
        - traefik.http.services.grafana.loadbalancer.server.port=3000

  node-exporter:
    image: prom/node-exporter:v1.12.1
    command:
      - --path.rootfs=/host
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    volumes:
      - /:/host:ro,rslave
    networks:
      - internal
    deploy:
      mode: global

  cadvisor:
    # ghcr.io since v0.56 (gcr.io stops at 0.55.1). >=0.54 reads rootfs via containerd
    # (/var/run/containerd/containerd.sock through the /var/run mount) — needed on Docker 29's
    # containerd image store; 0.52 produced no `name` label, so container alerts never fired.
    image: ghcr.io/google/cadvisor:v0.60.6
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - internal
    deploy:
      mode: global
      resources:
        limits:
          memory: 256M

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.20.1
    environment:
      DATA_SOURCE_URI: core_postgresql:5432/postgres?sslmode=disable
      DATA_SOURCE_USER: postgres_exporter
      DATA_SOURCE_PASS: ${POSTGRES_EXPORTER_PASSWORD}
    networks:
      - internal
    deploy:
      mode: replicated
      replicas: 1
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M

  alertmanager:
    image: prom/alertmanager:v0.34.2
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9093/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
    configs:
      - source: alertmanager-config
        target: /etc/alertmanager/alertmanager.yml
    networks:
      - internal
      - traefik-public
    deploy:
      mode: replicated
      replicas: 1
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M
      labels:
        - traefik.enable=true
        - traefik.http.routers.alertmanager.rule=Host(`alerts.${DOMAIN}`)
        - traefik.http.routers.alertmanager.entrypoints=websecure
        - traefik.http.routers.alertmanager.tls.certresolver=letsencrypt
        - traefik.http.routers.alertmanager.middlewares=admin-whitelist
        - traefik.http.services.alertmanager.loadbalancer.server.port=9093

  dozzle:
    # Pinned to a concrete v11 patch; Dozzle ships frequent UI changes
    # on floating tags, so always pin to a concrete version.
    image: amir20/dozzle:v11.4.1
    # Docker prieiga per read-only socket-proxy (ne raw socket). SVARBU: `:ro` ant raw
    # socket mount'o NEapsaugo — Docker API rašymas eina per socket'ą nepaisant ro vėliavos;
    # tik proxy su POST=0 realiai blokuoja mutacijas.
    environment:
      DOCKER_HOST: tcp://core_socket-proxy:2375
      DOZZLE_DISABLE_SETUP_WIZARD: "true"     # no /data volume -> every restart would be a "fresh install"
      DOZZLE_IMAGE_CHECK_MODE: "off"          # needs IMAGES on the proxy (denied) + outbound calls
      DOZZLE_NO_ANALYTICS: "true"
    healthcheck:
      test: ["CMD", "/dozzle", "healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - traefik-public
      - internal
    deploy:
      mode: replicated
      replicas: 1
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M
      placement:
        constraints:
          - node.role == manager
      labels:
        - traefik.enable=true
        - traefik.http.routers.dozzle.rule=Host(`logs.${DOMAIN}`)
        - traefik.http.routers.dozzle.entrypoints=websecure
        - traefik.http.routers.dozzle.tls.certresolver=letsencrypt
        - traefik.http.routers.dozzle.middlewares=admin-whitelist
        - traefik.http.services.dozzle.loadbalancer.server.port=8080

# Docker Swarm configs are immutable after creation — any content
# change needs a new config name. Version-suffix each entry and bump
# the suffix whenever the underlying file changes so stack deploy
# swaps the reference instead of erroring "only updates to Labels are
# allowed". Old unreferenced configs can be pruned with
# `docker config prune`.
configs:
  prometheus-config:
    file: ./prometheus/prometheus.yml
    name: prometheus-config-v2
  alert-rules:
    file: ./prometheus/alert-rules.yml
    name: alert-rules-v3
  alertmanager-config:
    file: ./alertmanager/alertmanager.yml
    name: alertmanager-config-v4
  grafana-datasource:
    file: ./grafana/provisioning/datasources/datasource.yml
    name: grafana-datasource-v2
  grafana-dashboard-provider:
    file: ./grafana/provisioning/dashboards/dashboards.yml
    name: grafana-dashboard-provider-v2
  dashboard-node:
    file: ./grafana/dashboards/node-exporter.json
    name: dashboard-node-v2
  dashboard-docker:
    file: ./grafana/dashboards/docker.json
    name: dashboard-docker-v2
  dashboard-postgresql:
    file: ./grafana/dashboards/postgresql.json
    name: dashboard-postgresql-v2
  dashboard-traefik:
    file: ./grafana/dashboards/traefik.json
    name: dashboard-traefik-v2

networks:
  traefik-public:
    external: true
  internal:
    external: true
