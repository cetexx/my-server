global:
  # Per Google Workspace SMTP relay (2026-11-18). pickzy.app Workspace'as priima šį serverį pagal IP
  # (Admin → Gmail → Routing → SMTP relay service „my-server alerts (176.223.132.42)": tik šis IP,
  # privalomas TLS, siuntėjas — bet koks („Any addresses"), nes serverio siuntėjas yra cetex.dev, ne
  # Workspace'o domenas) ir laišką pristato Google viduje — į Inbox. Relay'us vokelio siuntėją
  # perrašo į postmaster@pickzy.app: SPF praeina pickzy.app vardu, DKIM nėra, o cetex.dev DMARC —
  # FAIL, tik politika `p=none`, tad laiškas pristatomas. NEKELTI cetex.dev DMARC į quarantine /
  # reject, kol alertai eina šiuo keliu — jie atsidurtų spam'e arba būtų atmesti.
  # Iki tol alertai ėjo per vietinį mail_mailserver iš alertmanager@cetex.dev, ir Gmail juos
  # atmetinėjo nuo 2026-11-09 (550-5.7.1 „very low reputation of the sending domain" — cAdvisor OOM
  # ciklo alertų lavina, 2,992 atmetimai): nė vienas alertas neatėjo.
  smtp_smarthost: 'smtp-relay.gmail.com:587'
  # Serverio, ne projekto adresas (owner'is, 2026-11-18: „siuntėjas turi būti alerts@cetex.dev").
  smtp_from: 'alerts@cetex.dev'
  # Relay'us, tikrindamas pagal IP, Workspace paskyrą atpažįsta iš HELO arba MAIL FROM domeno, o
  # cetex.dev — ne Workspace domenas: su HELO cetex.dev buvo „550 5.7.0 Mail relay denied … Invalid
  # credentials for relay for one of the domains in: cetex.dev (as obtained from HELO and MAIL FROM)".
  # Todėl HELO įvardija paskyrą, kurios relay'us tai yra; matomas siuntėjas lieka alerts@cetex.dev.
  smtp_hello: 'pickzy.app'
  smtp_require_tls: true

route:
  group_by: ['alertname', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'email'

  routes:
    # Critical — siųsti iš karto
    - matchers: ['severity="critical"']
      group_wait: 10s
      repeat_interval: 1h
      receiver: 'email'

receivers:
  - name: 'email'
    email_configs:
      # sarunas@pickzy.app — the owner's one address for every alert (2026-11-18). Gmail has
      # rejected mail from cetex.dev since 2026-11-09 (550-5.7.1, "very low reputation of the
      # sending domain": the cAdvisor OOM loop's alert storm, 2,992 bounces), so the gmail.com
      # recipients got nothing and each refusal kept the reputation down; they are gone.
      - to: 'sarunas@pickzy.app'
        send_resolved: true
        headers:
          Subject: '{{ if eq .Status "firing" }}[ALERT] {{ .CommonLabels.alertname }}{{ else }}[OK] {{ .CommonLabels.alertname }}{{ end }}'

inhibit_rules:
  # Jei critical aktyvus — nesiųsti warning to paties alerto
  - source_matchers: ['severity="critical"']
    target_matchers: ['severity="warning"']
    equal: ['alertname']
