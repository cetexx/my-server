global:
  # Siunčiam per vidinį mail serverį (PERMIT_DOCKER=network leidžia be auth)
  smtp_smarthost: 'mail_mailserver:25'
  # Domenas, kurį tvarko šio serverio mailserver (DKIM/SPF/DMARC sutvarkyti) — kad
  # Gmail nepriimtų kaip spoof (example.com SPF -all → hard-fail, alertai tyliai krisdavo).
  smtp_from: 'alertmanager@cetex.dev'       # SPF ip4:176.223.132.42 + Rspamd DKIM; pickzy.app is Google-only
  smtp_require_tls: false

route:
  group_by: ['alertname', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'email'

  routes:
    # Critical — siųsti iš karto
    - matchers: ['severity="critical"']
      group_wait: 10s
      repeat_interval: 1h
      receiver: 'email'

receivers:
  - name: 'email'
    email_configs:
      # sarunas@pickzy.app — the owner's one address for every alert (2026-11-18). Gmail has
      # rejected mail from cetex.dev since 2026-11-09 (550-5.7.1, "very low reputation of the
      # sending domain": the cAdvisor OOM loop's alert storm, 2,992 bounces), so the gmail.com
      # recipients got nothing and each refusal kept the reputation down; they are gone. For
      # pickzy.app the Workspace email allowlist carries 176.223.132.42.
      - to: 'sarunas@pickzy.app'
        send_resolved: true
        headers:
          Subject: '{{ if eq .Status "firing" }}[ALERT] {{ .CommonLabels.alertname }}{{ else }}[OK] {{ .CommonLabels.alertname }}{{ end }}'

inhibit_rules:
  # Jei critical aktyvus — nesiųsti warning to paties alerto
  - source_matchers: ['severity="critical"']
    target_matchers: ['severity="warning"']
    equal: ['alertname']
