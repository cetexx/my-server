version: "3.8"

services:
  mailserver:
    # v15: SpamAssassin/Amavis/Postgrey pašalinti → Rspamd (spam + DKIM signing).
    image: ghcr.io/docker-mailserver/docker-mailserver:15.1.0
    hostname: mail.${MAIL_DOMAIN}
    environment:
      OVERRIDE_HOSTNAME: mail.${MAIL_DOMAIN}
      # Rspamd: spam filtravimas + DKIM pasirašymas (vietoj OpenDKIM). Reikia Redis —
      # ENABLE_RSPAMD_REDIS=1 paleidžia lokalų Redis konteineryje (izoliuota nuo core_redis).
      ENABLE_RSPAMD: "1"
      ENABLE_RSPAMD_REDIS: "1"
      ENABLE_OPENDKIM: "0"
      ENABLE_OPENDMARC: "0"
      ENABLE_CLAMAV: "0"
      ENABLE_FAIL2BAN: "0"
      # DMS skaito Traefik acme.json TIESIOGIAI (žr. volumes). mail.cetex.dev cert'ą
      # gauna Roundcube router'is (Host(mail.cetex.dev)). Jokio certs-dumper / ordering.
      SSL_TYPE: letsencrypt
      # `connected-networks` = pasitiki tik prijungtų tinklų (internal) subnet'u, ne visu
      # 172.16.0.0/12 (`network`). alertmanager (ant internal) vis tiek gali siųsti be auth.
      PERMIT_DOCKER: connected-networks
      POSTMASTER_ADDRESS: postmaster@${MAIL_DOMAIN}
    ports:
      - target: 25
        published: 25
        protocol: tcp
        mode: host
      - target: 587
        published: 587
        protocol: tcp
        mode: host
      - target: 993
        published: 993
        protocol: tcp
        mode: host
    volumes:
      - /opt/my-server/mailserver/data:/var/mail
      - /opt/my-server/mailserver/state:/var/mail-state
      - /opt/my-server/mailserver/logs:/var/log/mail
      - /opt/my-server/mailserver/config:/tmp/docker-mailserver
      - /opt/my-server/traefik/acme/acme.json:/etc/letsencrypt/acme.json:ro
    networks:
      - internal
    deploy:
      mode: replicated
      replicas: 1
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M

  roundcube:
    image: roundcube/roundcubemail:1.6.20-apache
    environment:
      ROUNDCUBEMAIL_DB_TYPE: pgsql
      ROUNDCUBEMAIL_DB_HOST: core_postgresql
      ROUNDCUBEMAIL_DB_PORT: "5432"
      ROUNDCUBEMAIL_DB_NAME: roundcube
      ROUNDCUBEMAIL_DB_USER: roundcube
      ROUNDCUBEMAIL_DB_PASSWORD: ${ROUNDCUBE_DB_PASSWORD}
      # Jungiamasi vardu `mail.${MAIL_DOMAIN}`, o NE `mailserver`, ir tai ne
      # kosmetika. Mailserver'io sertifikatas išduotas mail.cetex.dev; jungiantis
      # trumpuoju serviso vardu TLS rankos paspaudimas krisdavo dar PRIEŠ
      # slaptažodžio tikrinimą:
      #
      #   Peer certificate CN=`mail.cetex.dev' did not match expected CN=`mailserver'
      #   IMAP Error: Unable to negotiate TLS
      #
      # Dėl to prisijungti prie webmail buvo neįmanoma NĖ VIENA paskyra.
      # Vardas rezolvinasi viduje, nes mailserver'io `hostname:` būtent toks,
      # tad srautas lieka overlay tinkle ir sertifikatas galioja.
      ROUNDCUBEMAIL_DEFAULT_HOST: tls://mail.${MAIL_DOMAIN}
      ROUNDCUBEMAIL_DEFAULT_PORT: "143"
      ROUNDCUBEMAIL_SMTP_SERVER: tls://mail.${MAIL_DOMAIN}
      ROUNDCUBEMAIL_SMTP_PORT: "587"
      # Image'as pats įjungia archive ir zipdownload; čia pridedami likusieji.
      # Jie jau guli konteineryje — buvo tiesiog neaktyvūs ($config['plugins']
      # numatytai tuščias), todėl webmail atrodė plikesnis, nei galėtų.
      #
      # managesieve (filtrai, „išvykęs" atsakiklis) SĄMONINGAI nepridėtas:
      # mailserver'yje ENABLE_MANAGESIEVE neįjungtas ir portas 4190 neklauso,
      # tad plugin'as tik rodytų neveikiantį skirtuką.
      # password taip pat ne: jam reikia atskiro draiverio prie
      # docker-mailserver, o slaptažodį keičia ./server.sh mail passwd.
      ROUNDCUBEMAIL_PLUGINS: "archive,zipdownload,markasjunk,attachment_reminder,emoticons,vcard_attachments,newmail_notifier,identicon,hide_blockquote,subscriptions_option"
    volumes:
      # Image'o oficialus kabliukas: entrypoint'as įtraukia KIEKVIENĄ .php failą
      # iš šio katalogo į konfigūracijos galą. Taip nustatymai, kurių nėra tarp
      # ROUNDCUBEMAIL_* kintamųjų (pvz. htmleditor), pasiekiami neperrašant
      # jokio image'o failo ir nenukenčiant per atnaujinimus.
      - /opt/my-server/mail/roundcube:/var/roundcube/config:ro
    networks:
      - traefik-public
      - internal
    deploy:
      mode: replicated
      replicas: 1
      labels:
        - traefik.enable=true
        # Vienas neutralus webmail host visiems (mail.$MAIL_DOMAIN = mail.cetex.dev).
        # Vartotojas jungiasi PILNU email adresu (info@natars.mobi, info@xheroes.agency).
        # Nori vanity URL (mail.<projektas>)? Pridėk `|| Host(`mail.<domenas>`)` + cert SAN.
        - traefik.http.routers.roundcube.rule=Host(`mail.${MAIL_DOMAIN}`)
        - traefik.http.routers.roundcube.entrypoints=websecure
        - traefik.http.routers.roundcube.tls.certresolver=letsencrypt
        - traefik.http.routers.roundcube.middlewares=rate-limit
        - traefik.http.services.roundcube.loadbalancer.server.port=80

networks:
  traefik-public:
    external: true
  internal:
    external: true
