# =============================================
# PostgreSQL 17 tuning — sized for the CONTAINER, not the host
# =============================================
#
# The previous version of this file was written for "16GB RAM VPS, 4 vCPU" and
# asked for shared_buffers = 4GB. The container, however, is capped at a few GB
# by its cgroup — so Postgres was promised twice the memory it can actually
# touch. Nothing broke while the databases were tiny (26-29 MB each, ~360 MiB
# resident), because shared_buffers pages are allocated lazily. As the working
# set grows the cgroup ceiling is reached and the kernel OOM-kills Postgres,
# taking down every tenant at once: natars, heroes, pickzy, pickzy_admin,
# grafana and roundcube share this one instance.
#
# Rule for future edits: these numbers must stay coherent with
# `deploy.resources.limits.memory` in core/docker-compose.yml. Today that limit
# is 6G, and the settings below assume it.

# Network — accept connections from the Docker Swarm overlay network.
# The postgres:alpine image's entrypoint sets this to '*' by default,
# but mounting a custom postgresql.conf overrides that default to
# 'localhost', which stops every containerized service (grafana,
# pickzy-api, etc.) from connecting. Keep this line or reintroduce
# the services-can't-reach-Postgres bug. Auth is still gated by
# pg_hba.conf + SCRAM.
listen_addresses = '*'

# Memory — 6G container
# shared_buffers: the usual 25% of what the container really has.
# work_mem is PER SORT NODE PER CONNECTION: at max_connections = 200 the old
# 64MB allowed pathological peaks measured in gigabytes inside a 2G box.
shared_buffers = 1536MB
effective_cache_size = 4GB
work_mem = 16MB
maintenance_work_mem = 256MB
wal_buffers = 16MB

# CPU — host has 6 cores, shared with the app containers
max_parallel_workers_per_gather = 2
max_parallel_workers = 4
max_worker_processes = 8

# Connections
max_connections = 200
superuser_reserved_connections = 5

# WAL
wal_level = replica
checkpoint_completion_target = 0.9
min_wal_size = 256MB
max_wal_size = 2GB

# Query planner
random_page_cost = 1.1
effective_io_concurrency = 200
default_statistics_target = 100

# Logging
log_min_duration_statement = 1000
log_checkpoints = on
log_connections = on
log_disconnections = on
log_lock_waits = on
log_temp_files = 0

# Autovacuum
autovacuum = on
autovacuum_max_workers = 3
autovacuum_naptime = 60
