version: "3.8"

services:
  traefik:
    # Pinned to the latest v3.7 patch. Floating `:v3` silently advanced
    # major lines in the past and introduced Docker API incompatibilities
    # — a `docker stack deploy` once pulled a newer image that couldn't
    # talk to the local daemon. Bump this pin intentionally when
    # upgrading; don't rely on the tag moving.
    image: traefik:v3.7.17
    command:
      - --api.dashboard=true
      # `ping` exposes /ping for the built-in `traefik healthcheck` CLI;
      # without it the compose-level healthcheck in this file reports
      # "please enable `ping` to use health check" and the service
      # never converges.
      - --ping=true
      # Per socket-proxy (read-only, filtruotas) — NE tiesiogiai unix socket'ą,
      # kad kompromituotas Traefik negautų root-equivalent prieigos prie host'o.
      - --providers.swarm.endpoint=tcp://core_socket-proxy:2375
      - --providers.swarm.exposedByDefault=false
      - --providers.swarm.network=traefik-public
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.letsencrypt.acme.storage=/acme/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
      # ANTRAS sprendiklis — DNS-01 per Cloudflare, TIK wildcard sertifikatams.
      # Esamas `letsencrypt` (HTTP-01) NELIEČIAMAS: visi kiti projektai lieka ant jo.
      #
      # Kodėl reikėjo: HTTP-01 wildcard sertifikato neišduoda iš principo, o
      # natars.mobi pasauliai gyvena po `sN.` subdomenais. Be `*.natars.mobi`
      # kiekvienas naujas pasaulis reikalaudavo ranka įrašyti hostą į DU maršrutus
      # ir laukti naujo sertifikato.
      - --certificatesresolvers.le-dns.acme.email=${ACME_EMAIL}
      # ATSKIRA saugykla — kad DNS-01 niekaip nepaliestų veikiančių HTTP-01
      # sertifikatų `acme.json` faile (17 jų, visi kiti projektai).
      - --certificatesresolvers.le-dns.acme.storage=/acme/acme-dns.json
      - --certificatesresolvers.le-dns.acme.dnschallenge=true
      - --certificatesresolvers.le-dns.acme.dnschallenge.provider=cloudflare
      # Iššūkio įrašo tikrinimas TIESIOGIAI viešuose serveriuose: host'o resolveris
      # gali laikyti pasenusį atsakymą keše, ir propagacijos laukimas užstrigtų.
      - --certificatesresolvers.le-dns.acme.dnschallenge.resolvers=1.1.1.1:53,8.8.8.8:53
      - --metrics.prometheus=true
      - --metrics.prometheus.entrypoint=metrics      # serve /metrics on :8082 (what Prometheus scrapes); was 404
      - --entrypoints.metrics.address=:8082
      - --global.aliasHeadersStrategy=keep            # silences 3.7's new startup warning; same behaviour as today
      - --log.level=INFO
    environment:
      # DNS-01 (`le-dns`) prisijungimas. Žetonas apribotas iki Zone:DNS:Edit +
      # Zone:Read TIK `natars.mobi` zonai; reikšmė guli /opt/my-server/.env
      # (teisės 600, ne git'e). Traefik jį paduoda lego bibliotekai.
      CF_DNS_API_TOKEN: ${CF_DNS_API_TOKEN}
    ports:
      - target: 80
        published: 80
        protocol: tcp
        mode: host
      - target: 443
        published: 443
        protocol: tcp
        mode: host
    healthcheck:
      # `traefik healthcheck` without args probes the API endpoint first
      # and errors "please enable ping" when the API isn't exposed. Pass
      # `--ping` so it hits /ping directly (which we enabled via the
      # `--ping=true` command flag).
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 5s
      retries: 3
    volumes:
      # Raw Docker socket PAŠALINTAS — Traefik discovery eina per core_socket-proxy.
      - /opt/my-server/traefik/acme:/acme
    networks:
      - traefik-public
      - internal
    deploy:
      mode: replicated
      replicas: 1
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M
      placement:
        constraints:
          - node.role == manager
      labels:
        - traefik.enable=true
        # Admin IP whitelist middleware (naudojamas visų admin servisų)
        - traefik.http.middlewares.admin-whitelist.ipallowlist.sourcerange=${ADMIN_WHITELIST_IPS}
        # Rate limit middleware viešiems servisams (200 req/s, burst 300).
        #
        # Buvo 100/s su burst 50 ir tai laužė normalų naršymą, o ne atakas.
        # Vienas airsoftpunks.lt puslapio atidarymas duoda ~190 užklausų
        # (Nuxt chunk'ai, 30+ SVG raštų, šriftai), kurias naršyklė per HTTP/2
        # paleidžia beveik vienu metu. Riba skaičiuojama VIENAM IP, tad
        # lankytojas atsitrenkdavo į ją pats vienas: 80 lygiagrečių užklausų
        # duodavo 7x 429, konsolėje 11 klaidų, nepasikraudavo dalis CSS ir
        # fono paveikslėlių.
        #
        # burst=300 telpa visas puslapis su atsarga, average=200/s leidžia
        # kibirui prisipildyti iki kito perėjimo. Vieno IP užtvindymą vis tiek
        # stabdo, o nuo paskirstytos atakos per IP riba ir taip negelbsti.
        - traefik.http.middlewares.rate-limit.ratelimit.average=200
        - traefik.http.middlewares.rate-limit.ratelimit.burst=300
        - traefik.http.middlewares.rate-limit.ratelimit.period=1s
        # Dashboard
        - traefik.http.routers.traefik-dashboard.rule=Host(`traefik.${DOMAIN}`)
        - traefik.http.routers.traefik-dashboard.entrypoints=websecure
        - traefik.http.routers.traefik-dashboard.tls.certresolver=letsencrypt
        - traefik.http.routers.traefik-dashboard.service=api@internal
        - traefik.http.routers.traefik-dashboard.middlewares=admin-whitelist
        - traefik.http.services.traefik-dashboard.loadbalancer.server.port=8080
        # Swarm provider auto-creates a service named `core-traefik`
        # from the swarm service name. It errors "port is missing" if
        # we don't explicitly bind it, even though no router references
        # this auto-service (`traefik-dashboard` is the only real one).
        # Point it at the same admin port to silence the log spam.
        - traefik.http.services.core-traefik.loadbalancer.server.port=8080

  # Read-only, filtruotas Docker API Traefik'ui. Kad kompromituotas internetui-atviras
  # Traefik NEgautų pilno /var/run/docker.sock (root-equivalent → viso host'o perėmimas).
  # Traefik jungiasi per tcp://core_socket-proxy:2375; POST=0 → jokių mutacijų/exec/secrets.
  socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0
    environment:
      # GET-only, tik ko reikia Swarm provider'iui:
      SWARM: 1
      SERVICES: 1
      TASKS: 1
      NETWORKS: 1
      NODES: 1
      ENDPOINTS: 1
      CONTAINERS: 1
      INFO: 1
      VERSION: 1
      EVENTS: 1
      PING: 1
      # Viskas kita (EXEC, SECRETS, CONFIGS, IMAGES, VOLUMES + bet koks write) — deny:
      POST: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - internal
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          memory: 64M
        reservations:
          memory: 16M

  # Write-enabled Docker API proxy Portainer'iui. Skirtingai nuo Traefik read-only proxy —
  # čia POST=1 (Portainer valdo servisus/konteinerius). Nauda vs raw socket: konteineryje
  # nėra socket failo, atskiras procesas ant internal, API-lygio filtras. NE sidabrinė kulka
  # (Portainer su write ~= host root), bet defense-in-depth + IP-whitelist + auth apsaugo.
  portainer-socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0
    environment:
      CONTAINERS: 1
      IMAGES: 1
      NETWORKS: 1
      VOLUMES: 1
      SERVICES: 1
      TASKS: 1
      NODES: 1
      SWARM: 1
      SECRETS: 1
      CONFIGS: 1
      PLUGINS: 1
      SYSTEM: 1
      INFO: 1
      VERSION: 1
      EVENTS: 1
      PING: 1
      DISTRIBUTION: 1
      EXEC: 1
      POST: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - internal
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          memory: 64M
        reservations:
          memory: 16M

  postgresql:
    # Pinned to the exact point release — 17.9-alpine is the newest
    # 17.x alpine tag on Docker Hub at time of pin. Bump intentionally
    # when a newer 17.x appears.
    image: postgres:17.9-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      ROUNDCUBE_DB_PASSWORD: ${ROUNDCUBE_DB_PASSWORD}
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD}
      POSTGRES_EXPORTER_PASSWORD: ${POSTGRES_EXPORTER_PASSWORD}
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 15s
      timeout: 5s
      retries: 5
    volumes:
      - /opt/my-server/postgresql/data:/var/lib/postgresql/data
    configs:
      - source: init-databases
        target: /docker-entrypoint-initdb.d/init-databases.sh
        mode: 0755
      - source: pg-tuning
        target: /etc/postgresql/postgresql.conf
    networks:
      - internal
    deploy:
      mode: replicated
      replicas: 1
      resources:
        limits:
          memory: 6G
        reservations:
          memory: 1G

  redis:
    image: redis:7.4.8-alpine  # latest within 7.4 at time of pin
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 15s
      timeout: 5s
      retries: 3
    volumes:
      - /opt/my-server/redis/data:/data
    networks:
      - internal
    deploy:
      mode: replicated
      replicas: 1
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

  portainer:
    # Bumped 2.21.5 → 2.33.1 (latest stable 2.x). The on-disk BoltDB
    # was migrated by a previous newer Portainer at some point — older
    # Portainer fatals "database schema version does not align with
    # server version" on startup.
    image: portainer/portainer-ce:2.45.3      # current LTS; BoltDB migration is one-way (rollback = /data tar)
    # Docker API per write socket-proxy (ne raw socket) — žr. portainer-socket-proxy aukščiau.
    command: -H tcp://core_portainer-socket-proxy:2375
    # No compose-level healthcheck — the portainer image ships no wget
    # or curl, and shell-less distroless variants leave nothing else
    # usable. If Portainer's HTTP is down, swarm restarts are overkill;
    # Traefik will stop routing to it regardless.
    volumes:
      - /opt/my-server/portainer/data:/data
    networks:
      - traefik-public
      - internal
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      labels:
        - traefik.enable=true
        - traefik.http.routers.portainer.rule=Host(`portainer.${DOMAIN}`)
        - traefik.http.routers.portainer.entrypoints=websecure
        - traefik.http.routers.portainer.tls.certresolver=letsencrypt
        - traefik.http.routers.portainer.middlewares=admin-whitelist
        - traefik.http.services.portainer.loadbalancer.server.port=9000

  adminer:
    image: adminer:6.3.0-standalone           # 4.x removed upstream; PG18 supported
    # No compose-level healthcheck. adminer:4-standalone runs PHP's
    # built-in dev server which handles probe requests poorly enough
    # to crash the container; swarm restart loop then makes it worse.
    # Traefik's own healthcheck (if we bolt one on later) can gate
    # routing without Docker restarting the process.
    environment:
      ADMINER_DEFAULT_SERVER: core_postgresql
    networks:
      - traefik-public
      - internal
    deploy:
      mode: replicated
      replicas: 1
      labels:
        - traefik.enable=true
        - traefik.http.routers.adminer.rule=Host(`adminer.${DOMAIN}`)
        - traefik.http.routers.adminer.entrypoints=websecure
        - traefik.http.routers.adminer.tls.certresolver=letsencrypt
        - traefik.http.routers.adminer.middlewares=admin-whitelist
        - traefik.http.services.adminer.loadbalancer.server.port=8080

  playwright:
    # Pinned to a concrete release tag. browserless pushes `:latest`
    # over any backward-incompatible API change without a heads-up, so
    # always reference the version tag directly. Bump intentionally.
    image: ghcr.io/browserless/chromium:v2.59.0
    environment:
      CONCURRENT: "5"                         # v2 names; MAX_* were v1 (MAX_QUEUE_LENGTH was never read)
      QUEUED: "10"
      TIMEOUT: "60000"
      TOKEN: ${PLAYWRIGHT_TOKEN}
    healthcheck:
      # browserless/chromium's /json/version sits behind the TOKEN auth
      # check in newer versions; unauthenticated probes return 401 and
      # `wget --spider` treats that as failure. /docs serves without
      # token and returns 200, so use it.
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/docs || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - traefik-public
      - internal
    deploy:
      mode: replicated
      replicas: 1
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M
      labels:
        - traefik.enable=true
        - traefik.http.routers.playwright.rule=Host(`playwright.${DOMAIN}`)
        - traefik.http.routers.playwright.entrypoints=websecure
        - traefik.http.routers.playwright.tls.certresolver=letsencrypt
        - traefik.http.routers.playwright.middlewares=admin-whitelist
        - traefik.http.services.playwright.loadbalancer.server.port=3000

  # Shepherd removed 2026-04-24. Pickzy runs a manual button-release
  # workflow (coordinated API + mobile tagging) so there is no work for
  # a label-driven auto-update daemon to do. The upstream project has
  # also been unmaintained since ~2023. If a future stack genuinely
  # needs this pattern, prefer `watchtower` or a purpose-built CI step.

configs:
  init-databases:
    file: ./init-db/init-databases.sh
  # Docker Swarm configs are immutable after creation — content can't be
  # updated in place, only replaced by a new config with a different
  # name. Bump the name suffix whenever postgresql.conf changes so the
  # stack deploy swaps the reference. Previous `core_pg-tuning` shipped
  # empty and was never refreshable; `-v2` fixes that.
  pg-tuning:
    file: ./postgresql/postgresql.conf
    name: pg-tuning-v4

networks:
  traefik-public:
    external: true
  internal:
    external: true
